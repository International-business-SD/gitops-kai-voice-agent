{{- if not .Values.image.tag }}
{{- fail "image.tag is empty — set it in kai-voice/app-config/<env>/values.yaml after pushing to ECR" }}
{{- end }}
{{- if ne (int .Values.replicas) 1 }}
{{- fail "replicas must be 1: one-time WhatsApp join grants are consumed in process memory (kai/join_grant.py InMemoryConsumeStore), so a second replica lets the same link be redeemed twice" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.name }}
    environment: {{ .Values.global.environment }}
    team: {{ .Values.team }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  strategy:
    # Recreate, not RollingUpdate: maxSurge would start a second pod before the
    # old one exits, and join grants live in that pod's memory. Two live pods
    # means a one-time WhatsApp link can be redeemed on each. Costs a short 503
    # at the ALB per deploy, which is the right trade for non-replicable auth state.
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
        environment: {{ .Values.global.environment }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["uvicorn", "voice.app:app", "--host", "0.0.0.0", "--port", "{{ .Values.containerPort }}"]
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          # Secret first, ConfigMap second: on a duplicate key the LAST source
          # wins, and operational config must beat a stale developer value that
          # rode into the shared secret from a laptop .env.
          envFrom:
            {{- if .Values.envFromSecret }}
            - secretRef:
                name: {{ .Values.envFromSecret }}
            {{- end }}
            - configMapRef:
                name: {{ .Values.name }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.probes.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
