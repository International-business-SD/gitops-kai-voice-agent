apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.name }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  # Derived, so renaming the Service cannot leave PGSQL_HOST pointing at the old name.
  PGSQL_HOST: {{ printf "%s.%s.svc.cluster.local" .Values.mirror.serviceName .Values.global.namespace | quote }}
  PGSQL_PORT: {{ .Values.mirror.port | quote }}
