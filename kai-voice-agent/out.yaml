# Source: kai-voice/templates/deployment-worker.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kai-voice-worker
  namespace: default
  labels:
    app: kai-voice-worker
    environment: dev
    team: ibd-cockpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kai-voice-worker
  # A new worker answers :8081 with 200 within ~4s, while it is still retrying
  # its LiveKit registration — verified against an unreachable URL. So Ready does
  # not mean dispatchable, and a readiness probe cannot close the gap. Holding the
  # new pod Ready for 20s before the old one drains does.
  minReadySeconds: 20
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: kai-voice-worker
        environment: dev
      annotations:
        checksum/config: 28de42e45f3d0473d63f1844464db2c7d487cffb425728998db1720fc9a7603d
        gitops.cockpit/managed-by: argocd
        gitops.cockpit/repo: gitops-cockpit-agent
        gitops.cockpit/workload: kai-voice
    spec:
      serviceAccountName: cockpit-voice-dev
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kai-voice-worker
          image: "009160046075.dkr.ecr.eu-central-1.amazonaws.com/kai-voice-agent-dev:stg"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          # Same image as the token server; only the command differs.
          command: ["python", "-m", "voice.livekit_agent", "start"]
          ports:
            - name: agent-health
              containerPort: 8081
              protocol: TCP
          # Secret first, ConfigMap second — see deployment.yaml for why.
          envFrom:
            - secretRef:
                name: cockpit-agent-env
            - configMapRef:
                name: kai-voice-config
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          # The LiveKit framework serves this and returns 503 once the inference
          # subprocess dies or the connection is given up. Without it a wedged
          # worker stays Running forever and callers hear silence: there is no
          # Service, so nothing else would ever notice.
          livenessProbe:
            httpGet:
              path: /
              port: agent-health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      # No Service: the worker dials out to LiveKit Cloud and nothing in the
      # cluster connects to it. The port above exists only for the kubelet probe.
      #
      # Long grace period so a rolling update lets a call finish instead of
      # cutting the caller off mid-sentence.
      terminationGracePeriodSeconds: 300
---
# Source: kai-voice/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kai-voice
  namespace: default
  labels:
    app: kai-voice
    environment: dev
    team: ibd-cockpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kai-voice
  strategy:
    # Recreate, not RollingUpdate: maxSurge would start a second pod before the
    # old one exits, and join grants live in that pod's memory. Two live pods
    # means a one-time WhatsApp link can be redeemed on each. Costs a short 503
    # at the ALB per deploy, which is the right trade for non-replicable auth state.
    type: Recreate
  template:
    metadata:
      labels:
        app: kai-voice
        environment: dev
      annotations:
        checksum/config: 28de42e45f3d0473d63f1844464db2c7d487cffb425728998db1720fc9a7603d
        gitops.cockpit/managed-by: argocd
        gitops.cockpit/repo: gitops-cockpit-agent
        gitops.cockpit/workload: kai-voice
    spec:
      serviceAccountName: cockpit-voice-dev
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kai-voice
          image: "009160046075.dkr.ecr.eu-central-1.amazonaws.com/kai-voice-agent-dev:stg"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          command: ["uvicorn", "voice.app:app", "--host", "0.0.0.0", "--port", "8787"]
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          # Secret first, ConfigMap second: on a duplicate key the LAST source
          # wins, and operational config must beat a stale developer value that
          # rode into the shared secret from a laptop .env.
          envFrom:
            - secretRef:
                name: cockpit-agent-env
            - configMapRef:
                name: kai-voice-config
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
      terminationGracePeriodSeconds: 45
