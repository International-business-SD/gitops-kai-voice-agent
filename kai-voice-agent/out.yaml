# Source: kai-voice/templates/cronjob-mirror-sync.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kai-mirror-sync
  namespace: default
  labels:
    app: kai-mirror-sync
    team: ibd-cockpit
spec:
  schedule: "0 21 * * *"
  timeZone: "Etc/UTC"
  # The load swaps tables in place; a second concurrent run would fight the swap.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app: kai-mirror-sync
        spec:
          restartPolicy: Never
          # Pulls Domo over HTTPS and writes Postgres; needs neither AWS nor the K8s API.
          automountServiceAccountToken: false
          securityContext:
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mirror-sync
              image: "009160046075.dkr.ecr.eu-central-1.amazonaws.com/kai-voice-agent-dev:stg"
              imagePullPolicy: IfNotPresent
              # --force because the CronJob schedule is the only schedule. Without it
              # the app also applies metrics/mirror.json's daily window, and synced_at
              # is written after the load finishes — always inside the window at the
              # next fire, so every second night would skip every dataset and exit 0.
              command: ["python", "-m", "domo_mirror", "sync", "--force"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
              envFrom:
                - secretRef:
                    name: cockpit-agent-env
                # Write credentials live here alone, so the agent pods never hold them.
                # Ahead of the ConfigMap: the last source wins, and a hand-made
                # Secret must not be able to override PGSQL_HOST or PGSQL_SCHEMA.
                - secretRef:
                    name: kai-mirror-sync-env
                - configMapRef:
                    name: kai-voice-config
              resources:
                limits:
                  memory: 4Gi
                requests:
                  cpu: 500m
                  memory: 1Gi
